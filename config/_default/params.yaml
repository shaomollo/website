hugoblox:
  schema: "2.0"
  identity:
    name: "Shalom Omollo"
    type: person
    description: "Researcher working across healthcare, data, and public health."
  theme:
    mode: dark
    pack: minimal
    colors:
      primary: "#cb4a30"
      neutral: stone
    surfaces:
      background: "#000000"
      foreground: "#edf0eb"
      header: { background: "#000000", foreground: "#edf0eb" }
      footer: { background: "#000000", foreground: "#aab4ae" }
  typography:
    pack: academic
  layout:
    radius: none
    spacing: spacious
    avatar_shape: square
  header:
    enable: false
    style: navbar-simple
    sticky: true
    align: left
    search: false
    theme_toggle: false
    language_switcher: false
  footer:
    style: minimal
    language_switcher: false
  copyright:
    notice: "© {year} {name}."
    license: { type: custom }
  content:
    math: { enable: false }
    toc: { enable: false }
    reading_time: { enable: false }
  search: { enable: false }
  comments: { enable: false }
  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us
  repository: { enable: false }
  privacy: { enable: false }
  pro: { hide_attribution: false }
